name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci runs the postinstall pin, but it is lenient (never breaks an
      # install); re-run with --strict so CI fails loudly if uma-skill-tools
      # can't be pinned to the commit we depend on. scripts/pin-submodule.mjs
      # owns the SHA and explains why a vanilla submodule update is wrong.
      - run: npm ci
      - name: Pin uma-skill-tools
        run: node scripts/pin-submodule.mjs --strict
      # Gate the deploy: a red typecheck or test must never reach Pages. The
      # build steps (esbuild/vite) do not type-check, so this is the only guard.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - run: npm run build
      - run: npm run build:frontend
        env:
          VITE_BASE: /umalator/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
