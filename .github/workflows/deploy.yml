name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The build checks out upstream master for both submodules, so a deploy is
  # the only thing that refreshes the site's game data. Without a timer the
  # data sits at whatever the last push shipped. Off-the-hour to dodge the
  # scheduler's peak-load queueing.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  # write: the build job pushes a gitlink bump when upstream advanced
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # npm ci runs the postinstall submodule update, but it is lenient
      # (never breaks an install); re-run with --strict so the deploy fails
      # loudly if the submodules can't be brought to upstream master.
      # scripts/update-submodules.mjs explains why a vanilla submodule
      # update is wrong.
      - run: npm ci
      - name: Update submodules to upstream master
        run: node scripts/update-submodules.mjs --strict
      # Gate the deploy: a red typecheck or test must never reach Pages. The
      # build steps (esbuild/vite) do not type-check, so this is the only guard.
      # Build first: the worker integration tests spawn the built worker.
      - name: Typecheck
        run: npm run typecheck
      # The build copies game data from the just-updated submodule, so every
      # deploy ships the latest upstream data; the committed gitlink is only
      # a recorded baseline.
      - run: npm run build
      - name: Test
        run: npm test
      # Record the just-validated submodule as the committed baseline so a
      # plain `git pull` (whose post-merge hook runs update-submodules.mjs)
      # brings clones current without a manual bump. Runs after the gates so
      # a broken upstream never becomes the baseline. GITHUB_TOKEN pushes do
      # not trigger workflows, so this cannot loop.
      - name: Push gitlink bump
        run: |
          if git diff --quiet -- uma-tools; then
            echo "gitlink already current"
          else
            sha=$(git -C uma-tools rev-parse --short HEAD)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uma-tools
            git commit -m "chore(data): advance uma-tools to upstream $sha"
            git push origin HEAD:main
          fi
      - run: npm run build:frontend
        env:
          VITE_BASE: /umalator/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
