name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 24f0a88 is one commit ahead of uma-skill-tools master. We depend
      # on two unmerged changes from it: (1) the otherHorse() API used by
      # uma-tools/umalator/compare.ts, and (2) mood/popularity moved from
      # RaceParameters onto HorseParameters. The uma-tools submodule
      # records an older uma-skill-tools commit, so we re-pin here.
      - name: Pin uma-skill-tools to 24f0a88
        run: cd uma-tools/uma-skill-tools && git fetch origin 24f0a8862106dd4aaeea55e90e975acc9ca5d019 && git checkout 24f0a8862106dd4aaeea55e90e975acc9ca5d019

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:frontend
        env:
          VITE_BASE: /umalator/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
