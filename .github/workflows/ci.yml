name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Always check against upstream master for both submodules: an
      # unnoticed outdated version is worse than a loud failure here.
      - name: Update submodules to upstream master
        run: node scripts/update-submodules.mjs --strict

      - name: Typecheck
        run: npm run typecheck

      # The simulation worker integration tests spawn the built worker, so the
      # build must run before the test step.
      - name: Build workers
        run: npm run build

      - name: Test
        run: npm test
