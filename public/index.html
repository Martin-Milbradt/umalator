<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Umalator</title>

        <script type="module" crossorigin src="/app.js"></script>
        <link rel="stylesheet" crossorigin href="/index.css" />
    </head>
    <body
        class="m-0 p-0 box-border font-sans bg-zinc-900 text-zinc-200 h-dvh overflow-hidden"
    >
        <div
            id="toast-container"
            class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
            aria-live="polite"
        ></div>

        <div
            id="import-clipboard-modal"
            class="hidden fixed inset-0 z-40 bg-black/60 flex items-center justify-center"
        >
            <div class="bg-zinc-800 border border-zinc-700 rounded-md p-4 w-96 max-w-[90vw] shadow-xl">
                <h2 class="text-zinc-200 text-base font-semibold mb-3">
                    Import from Clipboard
                </h2>
                <label class="block mb-3">
                    <span class="text-zinc-400 text-xs">Config name</span>
                    <input
                        id="import-clipboard-name"
                        type="text"
                        class="mt-1 w-full px-2 py-1 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                    />
                </label>
                <label class="block mb-4">
                    <span class="text-zinc-400 text-xs"
                        >Template (copy skills & track from)</span
                    >
                    <select
                        id="import-clipboard-template"
                        class="mt-1 w-full px-2 py-1 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                    ></select>
                </label>
                <div class="flex justify-end gap-2">
                    <button
                        id="import-clipboard-cancel"
                        type="button"
                        class="px-3 py-1 rounded text-[13px] bg-zinc-700 hover:bg-zinc-600 text-zinc-200"
                    >
                        Cancel
                    </button>
                    <button
                        id="import-clipboard-confirm"
                        type="button"
                        class="px-3 py-1 rounded text-[13px] bg-sky-600 hover:bg-sky-700 text-white"
                    >
                        Import
                    </button>
                </div>
            </div>
        </div>

        <div
            id="layout"
            class="flex flex-col md:flex-row h-full overflow-hidden"
            style="--left-w: 800px; --top-h: 45vh"
        >
            <div
                id="left-pane"
                class="flex flex-col bg-zinc-800 w-full md:w-[var(--left-w)] h-[var(--top-h)] md:h-auto shrink-0 min-h-0"
            >
                <div class="px-2.5 pt-2.5 pb-2 shrink-0 bg-zinc-800 border-b border-zinc-700">
                    <h3
                        class="mt-0 mb-0 text-teal-400 text-base flex items-center gap-2 flex-wrap"
                    >
                        <button
                            id="add-skill-button"
                            class="bg-sky-600 text-white border-none rounded h-7 w-7 text-[13px] leading-none cursor-pointer flex items-center justify-center p-0 transition-colors hover:bg-sky-700 active:bg-sky-800"
                            title="Add new skill (hotkey: +)"
                        >
                            +
                        </button>
                        <span>Skills</span>
                        <span class="flex items-center gap-1.5 ml-auto text-[13px] font-normal">
                            <button
                                id="filter-icons-button"
                                class="bg-zinc-700 border border-zinc-600 rounded h-7 w-7 flex items-center justify-center cursor-pointer transition-colors hover:bg-zinc-600"
                                title="Toggle skill icons"
                                data-active="true"
                            >
                                <img alt="" class="w-5 h-5" />
                            </button>
                            <button
                                id="filter-owned-button"
                                class="bg-zinc-700 text-zinc-200 border border-zinc-600 rounded h-7 px-2 cursor-pointer transition-colors hover:bg-zinc-600"
                                title="Toggle: hide skills already on the uma"
                                data-active="false"
                            >
                                Owned
                            </button>
                            <select
                                id="filter-available-select"
                                class="py-1 px-1.5 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                            >
                                <option value="filtered" title="Skills that match the current distance, style, etc.">Filtered</option>
                                <option value="hint" title="Filtered, restricted to skills that have a hint set.">Hint</option>
                                <option value="noHint" title="Filtered, restricted to skills with no hint set.">No Hint</option>
                                <option value="unfiltered" title="Every skill in the config, even ones that cannot trigger under current settings.">Unfiltered</option>
                            </select>
                        </span>
                    </h3>
                </div>
                <div id="skills-container" class="flex-1 overflow-y-auto px-2.5 py-2"></div>
            </div>

            <div
                id="pane-divider"
                role="separator"
                aria-label="Resize panels"
                title="Drag to resize · double-click to reset"
                class="shrink-0 bg-zinc-700 hover:bg-sky-600 transition-colors touch-none select-none h-1.5 w-full cursor-row-resize md:h-auto md:w-1.5 md:cursor-col-resize"
            ></div>

            <div
                id="right-pane"
                class="w-full flex-1 min-w-0 min-h-0 p-2.5 flex flex-col bg-zinc-900 overflow-hidden"
            >
                <div class="shrink-0 flex flex-wrap items-center gap-1.5 mb-2.5">
                    <select
                        id="config-select"
                        class="flex-1 min-w-0 py-1 px-1.5 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                    ></select>
                    <select
                        id="config-menu"
                        class="py-1 px-1.5 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                        title="Import/export configs"
                    >
                        <option value="" disabled selected hidden>Configs</option>
                        <option value="duplicate-current">Duplicate Current</option>
                        <option value="export-current">Export Current</option>
                        <option value="export-all">Export All</option>
                        <option value="export-clipboard">Export to Clipboard</option>
                        <option value="import">Import</option>
                        <option value="import-clipboard">Import from Clipboard</option>
                        <option value="delete-current">Delete Current</option>
                    </select>
                    <select
                        id="help-menu"
                        class="py-1 px-1.5 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                        title="Help, tour, and contact"
                    >
                        <option value="" disabled selected hidden>Help</option>
                        <option value="about">About / Documentation</option>
                        <option value="tour">Take a Tour</option>
                        <option value="issue">Report Issue</option>
                        <option value="contact">Contact (Discord)</option>
                    </select>
                    <input
                        id="import-config-input"
                        type="file"
                        accept=".json"
                        multiple
                        class="hidden"
                    />
                    <input
                        id="seed-input"
                        type="number"
                        placeholder="seed"
                        title="Fixed RNG seed for reproducible runs. Leave blank for a fresh random seed each run."
                        class="h-7 w-20 px-1.5 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-[13px] focus:outline-none focus:border-sky-500"
                    />
                    <button
                        id="run-button"
                        class="h-7 px-2 text-white border-none rounded text-[13px] cursor-pointer transition-colors bg-sky-600 hover:bg-sky-700 active:bg-sky-800 disabled:bg-zinc-600 disabled:cursor-not-allowed flex items-center"
                    >
                        Run
                    </button>
                    <button
                        id="reset-button"
                        class="h-7 px-2 text-white border-none rounded text-[13px] cursor-pointer transition-colors bg-red-600 hover:bg-red-700 active:bg-red-800 flex items-center"
                    >
                        Reset
                    </button>
                </div>

                <!--
                    Scroll wrapper: the results table + uma/race box scroll as a
                    single unit when they don't fit. The table renders at full
                    height (no internal vertical scroll), so the whole panel's
                    content overflows here rather than squeezing the table into a
                    fixed-height box.
                -->
                <div id="right-scroll" class="flex-1 min-h-0 overflow-y-auto">
                <div
                    id="results-container"
                    class="bg-zinc-800 text-zinc-200 p-2.5 rounded-md text-sm leading-normal overflow-x-auto border border-zinc-700 mb-2.5"
                >
                    <div
                        id="results-status"
                        class="text-zinc-400 mb-2 flex items-center justify-between"
                    >
                        <span id="results-count">No results yet</span>
                        <span id="results-last-run"></span>
                    </div>
                    <div id="results-totals" class="hidden mb-2 p-2 bg-zinc-900 rounded border border-teal-700">
                        <span class="text-teal-400 font-semibold">Selection Total:</span>
                        <span id="totals-cost" class="ml-2"></span>
                        <span id="totals-mean" class="ml-4"></span>
                        <span id="totals-efficiency" class="ml-4"></span>
                        <span id="totals-minmax" class="ml-4"></span>
                    </div>
                    <table id="results-table" class="w-full text-left whitespace-nowrap">
                        <thead class="text-teal-400 border-b border-zinc-700">
                            <tr>
                                <th class="p-1 w-8"><input type="checkbox" id="select-all-checkbox" title="Select all" /></th>
                                <th class="p-1 w-8"></th>
                                <th class="p-1 cursor-pointer hover:text-teal-300" data-sort="skill" title="Skill name">Skill</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="cost" title="Skill point cost after discount, including any uncovered prerequisites">Cost</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="discount" title="Hint discount applied to this skill">Disc</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="meanLength" title="Average length gained versus not having the skill, across all simulations">Mean</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="medianLength" title="Median length gained: half of races gain more, half less">Median</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="meanLengthPerCost" title="Efficiency: mean length gained per skill point (×1000)">Mean/Cost</th>
                                <th class="p-1 text-right" title="Smallest and largest single-race gain observed">Min-Max</th>
                                <th class="p-1 text-right" title="Outcome spread: the central percentile band of per-race gains (e.g. 2.5–97.5%). How much the result swings race to race.">Range</th>
                                <th class="p-1 text-right" title="Confidence interval of the mean gain (mean ± z × standard error): how precisely the average is estimated.">Mean CI</th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody"></tbody>
                    </table>
                </div>

                <div
                    class="p-2.5 bg-zinc-800 rounded-md border border-zinc-700"
                >
                    <div id="uma-container"></div>
                    <div id="track-container"></div>
                </div>
                </div>
            </div>
        </div>
    </body>
</html>
