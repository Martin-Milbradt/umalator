<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Umalator</title>

        <script type="module" crossorigin src="/app.js"></script>
        <link rel="stylesheet" crossorigin href="/index.css" />
    </head>
    <body
        class="m-0 p-0 box-border font-sans bg-zinc-900 text-zinc-200 h-screen overflow-hidden"
    >
        <div
            id="toast-container"
            class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
            aria-live="polite"
        ></div>

        <div class="flex h-screen">
            <div
                class="flex flex-col bg-zinc-800 border-r border-zinc-700 w-[800px] h-screen"
            >
                <div class="px-2.5 pt-2.5 pb-2 shrink-0 bg-zinc-800 border-b border-zinc-700">
                    <h3
                        class="mt-0 mb-0 text-teal-400 text-base flex items-center gap-2 flex-wrap"
                    >
                        <button
                            id="add-skill-button"
                            class="bg-sky-600 text-white border-none rounded w-6 h-6 text-lg leading-none cursor-pointer flex items-center justify-center p-0 transition-colors hover:bg-sky-700 active:bg-sky-800"
                            title="Add new skill"
                        >
                            +
                        </button>
                        <span>Skills</span>
                        <span class="flex items-center gap-1.5 ml-auto text-[13px] font-normal">
                            <button
                                id="filter-owned-button"
                                class="bg-zinc-700 text-zinc-200 border border-zinc-600 rounded h-7 px-2 cursor-pointer transition-colors hover:bg-zinc-600"
                                title="Toggle: hide skills already on the uma"
                                data-active="false"
                            >
                                Owned
                            </button>
                            <button
                                id="filter-available-button"
                                class="bg-zinc-700 text-zinc-200 border border-zinc-600 rounded h-7 px-2 cursor-pointer transition-colors hover:bg-zinc-600"
                                title="Cycle: off → only with hints → only without hints"
                                data-state="off"
                            >
                                Available: off
                            </button>
                        </span>
                    </h3>
                </div>
                <div id="skills-container" class="flex-1 overflow-y-auto px-2.5 py-2"></div>
            </div>

            <div class="w-full p-2.5 flex flex-col bg-zinc-900 overflow-y-auto">
                <div class="flex items-center gap-2.5 mb-2.5">
                    <select
                        id="config-select"
                        class="flex-1 p-2 bg-zinc-700 text-zinc-200 border border-zinc-600 rounded text-sm focus:outline-none focus:border-sky-500"
                    ></select>
                    <button
                        id="duplicate-config-button"
                        class="bg-sky-600 text-white border-none rounded h-9 w-9 text-lg leading-none cursor-pointer flex items-center justify-center p-0 transition-colors hover:bg-sky-700 active:bg-sky-800"
                        title="Duplicate config file"
                    >
                        +
                    </button>
                    <div class="relative">
                        <button
                            id="config-menu-button"
                            class="bg-zinc-600 text-white border-none rounded h-9 px-2 text-sm cursor-pointer transition-colors hover:bg-zinc-500 active:bg-zinc-700 flex items-center gap-1"
                            title="Import/export configs"
                            aria-haspopup="true"
                            aria-expanded="false"
                        >
                            Configs
                            <span class="text-xs leading-none">&#9662;</span>
                        </button>
                        <div
                            id="config-menu"
                            class="hidden absolute right-0 top-full mt-1 bg-zinc-700 border border-zinc-600 rounded shadow-lg z-20 min-w-[160px] overflow-hidden"
                            role="menu"
                        >
                            <button
                                id="export-current-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600"
                                role="menuitem"
                            >
                                Export Current
                            </button>
                            <button
                                id="export-all-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600"
                                role="menuitem"
                            >
                                Export All
                            </button>
                            <button
                                id="import-menu-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600"
                                role="menuitem"
                            >
                                Import
                            </button>
                            <button
                                id="delete-current-button"
                                class="block w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-red-900/40 border-t border-zinc-600"
                                role="menuitem"
                            >
                                Delete Current
                            </button>
                        </div>
                    </div>
                    <div class="relative">
                        <button
                            id="help-menu-button"
                            class="bg-zinc-600 text-white border-none rounded h-9 px-2 text-sm cursor-pointer transition-colors hover:bg-zinc-500 active:bg-zinc-700 flex items-center gap-1"
                            title="Help, tour, and contact"
                            aria-haspopup="true"
                            aria-expanded="false"
                        >
                            Help
                            <span class="text-xs leading-none">&#9662;</span>
                        </button>
                        <div
                            id="help-menu"
                            class="hidden absolute right-0 top-full mt-1 bg-zinc-700 border border-zinc-600 rounded shadow-lg z-20 min-w-[180px] overflow-hidden"
                            role="menu"
                        >
                            <button
                                id="help-about-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600"
                                role="menuitem"
                            >
                                About / Documentation
                            </button>
                            <button
                                id="help-tour-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600"
                                role="menuitem"
                            >
                                Take a Tour
                            </button>
                            <button
                                id="help-issue-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600 border-t border-zinc-600"
                                role="menuitem"
                            >
                                Report Issue
                            </button>
                            <button
                                id="help-contact-button"
                                class="block w-full text-left px-3 py-2 text-sm text-zinc-200 hover:bg-zinc-600"
                                role="menuitem"
                            >
                                Contact (Discord)
                            </button>
                        </div>
                    </div>
                    <input
                        id="import-config-input"
                        type="file"
                        accept=".json"
                        multiple
                        class="hidden"
                    />
                    <button
                        id="run-button"
                        class="h-9 px-4 text-white border-none rounded-md text-base font-semibold cursor-pointer transition-colors bg-sky-600 hover:bg-sky-700 active:bg-sky-800 disabled:bg-zinc-600 disabled:cursor-not-allowed flex items-center"
                    >
                        Run Calculations
                    </button>
                    <button
                        id="reset-button"
                        class="h-9 px-4 text-white border-none rounded-md text-base font-semibold cursor-pointer transition-colors bg-red-600 hover:bg-red-700 active:bg-red-800 flex items-center"
                    >
                        Reset
                    </button>
                </div>

                <div
                    id="results-container"
                    class="flex-1 bg-zinc-800 text-zinc-200 p-2.5 rounded-md text-sm leading-normal overflow-y-auto border border-zinc-700 mb-2.5"
                >
                    <div
                        id="results-status"
                        class="text-zinc-400 mb-2 flex items-center justify-between"
                    >
                        <span id="results-count">No results yet</span>
                        <span id="results-last-run"></span>
                    </div>
                    <div id="results-totals" class="hidden mb-2 p-2 bg-zinc-900 rounded border border-teal-700">
                        <span class="text-teal-400 font-semibold">Selection Total:</span>
                        <span id="totals-cost" class="ml-2"></span>
                        <span id="totals-mean" class="ml-4"></span>
                        <span id="totals-efficiency" class="ml-4"></span>
                        <span id="totals-minmax" class="ml-4"></span>
                    </div>
                    <table id="results-table" class="w-full text-left">
                        <thead class="text-teal-400 border-b border-zinc-700">
                            <tr>
                                <th class="p-1 w-8"><input type="checkbox" id="select-all-checkbox" title="Select all" /></th>
                                <th class="p-1 w-8"></th>
                                <th class="p-1 cursor-pointer hover:text-teal-300" data-sort="skill">Skill</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="cost">Cost</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="discount">Disc</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="meanLength">Mean</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="medianLength">Median</th>
                                <th class="p-1 cursor-pointer hover:text-teal-300 text-right" data-sort="meanLengthPerCost">Mean/Cost</th>
                                <th class="p-1 text-right">Min-Max</th>
                                <th class="p-1 text-right">95% CI</th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody"></tbody>
                    </table>
                </div>

                <div
                    class="p-2.5 bg-zinc-800 rounded-md border border-zinc-700"
                >
                    <div id="uma-container"></div>
                    <div id="track-container"></div>
                </div>
            </div>
        </div>
    </body>
</html>
